# Conda environment for MOKE_measurement, reflecting the actively-used code
# (moke/devices/*.py, moke/rig.py) as of 2026-08-09. Generated by scanning
# every import in the repo -- see the notes below for what's deliberately
# left out and why.
#
# Create with:  conda env create -f environment.yml
# Update with:  conda env update -f environment.yml --prune
name: moke-measurement
channels:
  - conda-forge
dependencies:
  - python=3.11          # matches the interpreter this repo is currently run/tested with
  - numpy                 # moke/devices/helicam.py, helicam_test.py, moke/rig.py
  - matplotlib             # moke/devices/helicam_test.py, moke/rig.py (plotting + live preview)
  - pyqt                   # provides PyQt5 -- matplotlib.use("qtagg") needs a Qt binding
                            # for the interactive windows in helicam_test.py mode 3 and
                            # rig.py's camera_stream_frame(); plan doc §5.1 also names PyQt5.

# ---------------------------------------------------------------------------
# NOT installable via this file -- vendor SDKs and a sibling local repo,
# found via sys.path manipulation rather than pip/conda. Document, don't
# pretend a conda/pip package can substitute for these:
#
#   libHeLIC       Heliotis heliCam C3 Python wrapper (moke/devices/helicam.py).
#                  Loaded from moke/devices/wrapper/ if present in this repo,
#                  else C:\Program Files\Heliotis\heliCam\Python\wrapper.
#                  Requires the Heliotis heliCam SDK/driver installed on the
#                  machine -- this is not a PyPI/conda package.
#
#   Thorlabs Kinesis DLLs   moke/devices/stage.py and kcube.py load
#                  Thorlabs.MotionControl.Benchtop.BrushlessMotor.dll and
#                  Thorlabs.MotionControl.KCube.DCServo.dll directly via
#                  ctypes from C:\Program Files\Thorlabs\Kinesis. Requires
#                  the Thorlabs Kinesis software installed on the machine.
#
#   t_bbd_ds, t_kcube   Only imported by the not-yet-updated moke/rig.py and
#                  moke/cli.py (see device_interface_instruction.md -- these
#                  two call sites still use the pre-refactor device classes
#                  from the sibling repo F:\Git\optical_devices_toolbox\
#                  scripts_thorlabs, added to sys.path at import time, rather
#                  than the current moke/devices/stage.py + kcube.py).
#
# Also stale, not part of the current working package: moke/cli.py still
# imports moke_rig, helicam_c3, and hytools (pre-refactor module names/an
# undocumented local package) -- it predates the moke/ restructure and does
# not run as-is. Not included above since it isn't part of the currently
# working code path.
